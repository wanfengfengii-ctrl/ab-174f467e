# 深空测控时间归一化服务编排。
#
#   HOST_PORT=9090 docker compose up --build        # 启动 API
#   docker compose run --rm verify                 # 一次性校验（自动退出）
#   docker compose --profile verify up --build     # 同时跑 API 与 verify
#
# 宿主机端口通过环境变量 HOST_PORT 配置，默认 8080。

services:
  api:
    build:
      context: .
      target: api
    image: deep-space-time-normalizer:latest
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: deep-space-time-normalizer-verify:latest
    environment:
      API_BASE: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
